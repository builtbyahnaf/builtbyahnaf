<svg xmlns="http://www.w3.org/2000/svg" width="120" height="72" viewBox="0 0 120 72" role="img">
<style>.rp{transform-box:fill-box;transform-origin:center;animation:rp 3.6s ease-out infinite;opacity:0}
@keyframes rp{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.cur{animation:cur 1.1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.bl,.bl2{animation:pong 1.7s linear infinite}.bl2{animation-delay:-.09s}
@keyframes pong{0%{transform:translate(0,8px)}25%{transform:translate(30px,-12px)}50%{transform:translate(60px,8px)}75%{transform:translate(30px,-12px)}100%{transform:translate(0,8px)}}
.p1{animation:pa 1.7s ease-in-out infinite alternate}.p2{animation:pa 1.7s ease-in-out infinite alternate-reverse}
@keyframes pa{from{transform:translateY(-6px)}to{transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path d="M36 22l16 14-16 14" fill="none" stroke="#2F5FD0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect class="cur" x="58" y="47" width="22" height="3.2" rx="1.6" fill="#6B4FE0"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="48" viewBox="0 0 800 48" role="img">
<style>.o{transform-origin:400px 24px}.o1{animation:spin 5s linear infinite}.o2{animation:spinr 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.15) rotate(90deg);opacity:1}}
.pg{transform-origin:400px 24px;animation:pg 3.2s ease-out infinite}@keyframes pg{0%{transform:scale(.5);opacity:.6}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B4FE0" stop-opacity="0"/><stop offset="1" stop-color="#2F5FD0" stop-opacity="0.55"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F5FD0" stop-opacity="0.55"/><stop offset="1" stop-color="#6B4FE0" stop-opacity="0"/></linearGradient></defs>
<rect x="80" y="24" width="268" height="1" fill="url(#l)"/><rect x="452" y="24" width="268" height="1" fill="url(#r)"/>
<circle class="pg" cx="400" cy="24" r="9" fill="none" stroke="#2F5FD0" stroke-width="1"/>
<circle cx="400" cy="24" r="12" fill="none" stroke="#2F5FD0" opacity="0.35"/>
<g class="o o2"><circle cx="400" cy="24" r="19" fill="none" stroke="#6B4FE0" opacity="0.4" stroke-dasharray="1.5 5"/></g>
<g class="o o1"><circle cx="412" cy="24" r="2.3" fill="#2F5FD0"/></g>
<g transform="translate(400 24)"><path class="tw" d="M0-7L2.2-2.2 7 0 2.2 2.2 0 7-2.2 2.2-7 0-2.2-2.2Z" transform="scale(0.55)" fill="#6B4FE0"/></g>
</svg>

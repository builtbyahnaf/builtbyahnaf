<svg xmlns="http://www.w3.org/2000/svg" width="264" height="216" viewBox="0 0 264 216" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Roboto, Arial, sans-serif" role="img">
<style>
.rp{transform-box:fill-box;transform-origin:center;animation:rp 3.6s ease-out infinite;opacity:0}
@keyframes rp{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.cur{animation:cur 1.1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.bl,.bl2{animation:pong 1.7s linear infinite}.bl2{animation-delay:-.09s}
@keyframes pong{0%{transform:translate(0,8px)}25%{transform:translate(20px,-10px)}50%{transform:translate(40px,8px)}75%{transform:translate(20px,-10px)}100%{transform:translate(0,8px)}}
.p1{animation:pa 1.7s ease-in-out infinite alternate}.p2{animation:pa 1.7s ease-in-out infinite alternate-reverse}
@keyframes pa{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F5" stop-opacity="0.75"/><stop offset="0.35" stop-color="#A18CFA" stop-opacity="0.35"/><stop offset="1" stop-color="#A18CFA" stop-opacity="0"/></linearGradient></defs>
<rect x="4" y="6" width="256" height="1" fill="url(#hr)"/>
<path transform="translate(240 22)" d="M1 11L11 1M3.5 1H11V8.5" fill="none" stroke="#7FA8F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<g transform="translate(0 0)"><path d="M12 40l12 10-12 10" fill="none" stroke="#7FA8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="cur" x="32" y="58" width="16" height="2.6" rx="1.3" fill="#A18CFA"/><path d="M4 28h60" stroke="#7FA8F5" stroke-width="1" opacity="0.2"/></g>
<text x="4" y="108" font-size="20" font-weight="600" fill="#E8EEF9" letter-spacing="-0.2">Windows Utilities</text>
<text x="4" y="130" font-size="12.5" fill="#A9C2F8">Small tools. Practical solutions.</text>
<text x="4" y="158" font-size="12" fill="#8C99B5">Native tools: an app blocker and</text>
<text x="4" y="176" font-size="12" fill="#8C99B5">a Bluetooth volume fix.</text>
<text x="4" y="202" font-size="11.5" fill="#8C99B5"><tspan>C++</tspan><tspan dx="9" fill="#56648A">/</tspan><tspan dx="9">Windows</tspan><tspan dx="9" fill="#56648A">/</tspan><tspan dx="9">Native</tspan></text>
</svg>

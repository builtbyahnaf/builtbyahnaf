<text x="4" y="78" font-size="32" font-weight="600" fill="#0F1B33" letter-spacing="-0.5">Nirqoba</text>
<text x="4" y="106" font-size="15" fill="#2F5FD0">A programming language in the making.</text>
<text x="4" y="136" font-size="13.5" fill="#55627F">An ambitious general-purpose language exploring compiler</text>
<text x="4" y="156" font-size="13.5" fill="#55627F">engineering, runtime architecture, systems programming, and performance.</text>
<text x="4" y="190" font-size="12" fill="#55627F"><tspan>C++</tspan><tspan dx="9" fill="#8A96B0">/</tspan><tspan dx="9">Compiler design</tspan><tspan dx="9" fill="#8A96B0">/</tspan><tspan dx="9">Runtime</tspan></text>
</svg>

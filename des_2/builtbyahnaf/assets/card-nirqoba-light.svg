<svg xmlns="http://www.w3.org/2000/svg" width="800" height="212" viewBox="0 0 800 212" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Roboto, Arial, sans-serif" role="img">
<style>
.fl{stroke-dasharray:3 5;animation:fl 1.4s linear infinite} @keyframes fl{to{stroke-dashoffset:-16}}
.n{transform-box:fill-box;transform-origin:center;animation:np 3.6s ease-in-out infinite}
@keyframes np{0%,100%{transform:scale(1);opacity:.55}30%{transform:scale(1.6);opacity:1}}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.35s}.d4{animation-delay:1.6s}.d5{animation-delay:1.85s}
.hl{transform-box:fill-box;transform-origin:center;animation:hl 3.6s ease-out infinite}
@keyframes hl{0%{transform:scale(.6);opacity:.5}60%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F5FD0" stop-opacity="0.75"/><stop offset="0.35" stop-color="#6B4FE0" stop-opacity="0.35"/><stop offset="1" stop-color="#6B4FE0" stop-opacity="0"/></linearGradient></defs>
<path transform="translate(770 26)" d="M1 11L11 1M3.5 1H11V8.5" fill="none" stroke="#2F5FD0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<g fill="none" stroke="#2F5FD0" stroke-width="1.2" opacity="0.5"><path class="fl" d="M664 50L604 104"/><path class="fl" d="M664 50L724 104"/><path class="fl" d="M604 104L568 160"/><path class="fl" d="M604 104L640 160"/><path class="fl" d="M724 104L688 160"/><path class="fl" d="M724 104L760 160"/></g>
<circle class="hl" cx="664" cy="50" r="8" fill="none" stroke="#2F5FD0"/>
<circle cx="664" cy="50" r="4.6" fill="#2F5FD0"/>
<circle class="n d1" cx="604" cy="104" r="4.2" fill="none" stroke="#6B4FE0" stroke-width="1.5"/>
<circle class="n d1" cx="724" cy="104" r="4.2" fill="none" stroke="#6B4FE0" stroke-width="1.5"/>
<circle class="n d2" cx="568" cy="160" r="3" fill="#6B4FE0"/>
<circle class="n d3" cx="640" cy="160" r="3" fill="#6B4FE0"/>

<svg xmlns="http://www.w3.org/2000/svg" width="264" height="216" viewBox="0 0 264 216" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Roboto, Arial, sans-serif" role="img">
<style>
.rp{transform-box:fill-box;transform-origin:center;animation:rp 3.6s ease-out infinite;opacity:0}
@keyframes rp{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.cur{animation:cur 1.1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.bl,.bl2{animation:pong 1.7s linear infinite}.bl2{animation-delay:-.09s}
@keyframes pong{0%{transform:translate(0,8px)}25%{transform:translate(20px,-10px)}50%{transform:translate(40px,8px)}75%{transform:translate(20px,-10px)}100%{transform:translate(0,8px)}}
.p1{animation:pa 1.7s ease-in-out infinite alternate}.p2{animation:pa 1.7s ease-in-out infinite alternate-reverse}
@keyframes pa{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F5FD0" stop-opacity="0.75"/><stop offset="0.35" stop-color="#6B4FE0" stop-opacity="0.35"/><stop offset="1" stop-color="#6B4FE0" stop-opacity="0"/></linearGradient></defs>
<rect x="4" y="6" width="256" height="1" fill="url(#hr)"/>
<path transform="translate(240 22)" d="M1 11L11 1M3.5 1H11V8.5" fill="none" stroke="#2F5FD0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<g transform="translate(0 0)"><rect class="p1" x="6" y="34" width="3.4" height="30" rx="1.7" fill="#2F5FD0"/><rect class="p2" x="58" y="34" width="3.4" height="30" rx="1.7" fill="#6B4FE0"/><path d="M34 30v38" stroke="#2F5FD0" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/><g class="bl2"><circle cx="14" cy="50" r="3.4" fill="#0F1B33" opacity="0.25"/></g><g class="bl"><circle cx="14" cy="50" r="3.4" fill="#0F1B33"/></g></g>
<text x="4" y="108" font-size="20" font-weight="600" fill="#0F1B33" letter-spacing="-0.2">Neon Table Tennis</text>
<text x="4" y="130" font-size="12.5" fill="#2F5FD0">Engineering, with a little play.</text>
<text x="4" y="158" font-size="12" fill="#55627F">A neon-themed table tennis game</text>
<text x="4" y="176" font-size="12" fill="#55627F">for Windows, built in C.</text>
<text x="4" y="202" font-size="11.5" fill="#55627F"><tspan>C</tspan><tspan dx="9" fill="#8A96B0">/</tspan><tspan dx="9">Game dev</tspan></text>
</svg>
